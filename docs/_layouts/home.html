---
layout: default
---
<div class="home">
  {{ content }}
  {%- if site.posts.size > 0 -%}
    <h2 class="post-list-heading" style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; color: #0f172a; margin-top: 2rem;">Latest Articles</h2>
    <ul class="post-list">
      {%- for post in site.posts -%}
      <li>
        <span class="post-meta">{{ post.date | date: "%B %-d, %Y" }}</span>
        <h3>
          <a class="post-link" href="{{ post.url | relative_url }}">
            {{ post.title | escape }}
          </a>
        </h3>
        <p style="color: #475569; margin-top: 0.75rem; font-size: 1rem; line-height: 1.5;">{{ post.excerpt | strip_html | truncatewords: 25 }}</p>
      </li>
      {%- endfor -%}
    </ul>
  {%- endif -%}
</div>
